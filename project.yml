name: StatusTodo
options:
  bundleIdPrefix: com.levijackson
  deploymentTarget:
    macOS: "14.0"
  minimumXcodeVersion: "15.0"
  xcodeVersion: "16.0"

targets:
  StatusTodo:
    type: application
    platform: macOS
    sources:
      - StatusTodo
    info:
      path: StatusTodo/Info.plist
      properties:
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSHumanReadableDescription: StatusTodo Task Manager
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levijackson.statustodo
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: YES
        # AppIcon.icns is hand-built (Resources/AppIcon.icns) - actool drops
        # everything above 256px, leaving the Dock with no usable size.
